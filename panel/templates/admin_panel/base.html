{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Panel Administrativo{% endblock %}</title>
        {% tailwind_css %}
    </head>
    <body class="bg-slate-50 text-slate-900">
        <div class="min-h-screen flex bg-slate-50">
            <aside class="sticky top-0 h-screen w-72 overflow-y-auto bg-slate-950 text-slate-100 shadow-xl">
                <div class="px-6 py-6 border-b border-slate-800">
                    <span class="text-xl font-semibold">Panel</span>
                </div>
                <nav class="px-4 py-6 space-y-2">
                    <a class="block rounded-2xl px-4 py-3 text-sm font-medium transition hover:bg-slate-800 {% if request.resolver_match.namespaced_view_name == 'panel:dashboard' %}bg-slate-800 text-white{% else %}text-slate-300{% endif %}" href="{% url 'panel:dashboard' %}">
                        Dashboard
                    </a>
                    <a class="block rounded-2xl px-4 py-3 text-sm font-medium transition hover:bg-slate-800 {% if request.resolver_match.namespaced_view_name == 'panel:escuelas' %}bg-slate-800 text-white{% else %}text-slate-300 hover:text-white{% endif %}" href="{% url 'panel:escuelas' %}">
                        Escuelas
                    </a>
                    <a class="block rounded-2xl px-4 py-3 text-sm font-medium transition hover:bg-slate-800 {% if request.resolver_match.namespaced_view_name == 'panel:alumnos' %}bg-slate-800 text-white{% else %}text-slate-300 hover:text-white{% endif %}" href="{% url 'panel:alumnos' %}">
                        Alumnos
                    </a>
                    <a class="block rounded-2xl px-4 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white" href="#">Importaciones</a>
                </nav>
                <div class="mt-auto px-6 py-6 border-t border-slate-800">
                    <a class="block w-full rounded-2xl bg-slate-700 px-4 py-3 text-center text-sm font-semibold text-white transition hover:bg-slate-600" href="{% url 'logout' %}">
                        Cerrar sesión
                    </a>
                </div>
            </aside>

            <main class="grow">
                <div class="sticky top-0 z-20 border-b border-slate-200 bg-slate-50/95 backdrop-blur">
                    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 sm:px-8">
                        <div>
                            <p class="text-sm uppercase tracking-[0.2em] text-slate-500">Administración</p>
                            <h1 class="mt-1 text-2xl font-semibold text-slate-900">Sistema de Asistencia - Santiago Crece con Vos</h1>
                        </div>
                    </div>
                </div>
                <div class="mx-auto max-w-7xl px-6 py-6 sm:px-8">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </body>
</html>
