<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel Administrativo{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="d-flex min-vh-100">
        <aside class="bg-dark text-white p-3" style="width: 260px; min-height: 100vh;">
            <h4 class="mb-4">Panel</h4>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a class="nav-link text-white {% if request.resolver_match.namespaced_view_name == 'panel:dashboard' %}active{% endif %}" href="{% url 'panel:dashboard' %}">
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#">Escuelas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#">Alumnos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#">Importaciones</a>
                </li>
            </ul>
            <div class="mt-4">
                <a class="btn btn-outline-light w-100" href="{% url 'logout' %}">Cerrar sesión</a>
            </div>
        </aside>

        <main class="flex-grow-1 p-4">
            <nav class="navbar navbar-expand-lg navbar-light bg-white rounded shadow-sm mb-4">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h5">Sistema de Gestión</span>
                </div>
            </nav>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
