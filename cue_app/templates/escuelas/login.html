{% extends "escuelas/base.html" %}

{% block title %}Sistema - Login{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="card-title mb-4">Login</h1>

                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="cue" class="form-label">CUE</label>
                            <input type="text" id="cue" name="cue" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="dni" class="form-label">Contraseña</label>
                            <input type="text" id="dni" name="dni" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
